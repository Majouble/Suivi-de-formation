<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-alt: #f3f3fb;
    --text: #1e1e28;
    --text-muted: #5d5d6b;
    --border: #dbdbe4;
    --accent: #000091;
    --accent-contrast: #ffffff;
    --ok: #18753c;
    --ok-bg: #e8f5ea;
    --warn: #8d5a00;
    --warn-bg: #fef2e1;
    --danger: #b71c1c;
    --danger-bg: #fde8e8;
    --info-bg: #e5e5f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171f; --surface: #1d1d27; --surface-alt: #24242f;
      --text: #f1f1f4; --text-muted: #a3a3b2; --border: #34343f;
      --accent: #8b8bff; --accent-contrast: #0d0d14;
      --ok: #4fd07a; --ok-bg: #123321; --warn: #f0b429; --warn-bg: #3a2a05;
      --danger: #ff6b6b; --danger-bg: #3a1414; --info-bg: #24243a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Work Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.45; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  a { color: var(--accent); }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  .skip-link { position: absolute; left: -999px; top: 0; background: var(--accent); color: var(--accent-contrast); padding: 8px 14px; z-index: 100; }
  .skip-link:focus { left: 8px; top: 8px; }
  .app { min-height: 100vh; width: 100%; }
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 28px; border-bottom: 2px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 20; }
  .app-name { font-size: 18px; font-weight: 700; margin: 0; }
  .app-sub { font-size: 12.5px; color: var(--text-muted); margin: 2px 0 0; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }
  .btn { border: 1.5px solid transparent; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; background: var(--surface-alt); border-color: var(--border); color: var(--text); }
  .btn:hover { filter: brightness(0.97); }
  .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .btn-secondary { background: transparent; border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  .btn-small { padding: 5px 10px; font-size: 12px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .content { padding: 24px 28px 80px; max-width: 1320px; margin: 0 auto; }
  .content:focus { outline: none; }
  .section-title { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
  .section-sub { font-size: 13px; color: var(--text-muted); margin: 0 0 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); padding: 20px 22px; margin-bottom: 20px; }
  .card h3 { margin: 0 0 12px; font-size: 14.5px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 900px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; } }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .field label { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--text-muted); font-weight: 600; }
  .field input, .field select, .field textarea { padding: 8px 10px; border: 1px solid var(--border); background: var(--surface-alt); color: var(--text); }
  .field textarea { min-height: 70px; resize: vertical; }
  .field input[type="color"] { padding: 3px; height: 38px; width: 64px; cursor: pointer; }
  .field-help { font-size: 11.5px; color: var(--text-muted); margin: 2px 0 0; }
  .row-inline { display: flex; align-items: center; gap: 8px; }
  .stat-tile { border: 1px solid var(--border); padding: 14px; display: flex; flex-direction: column; gap: 4px; }
  .stat-value { font-size: 22px; font-weight: 700; }
  .stat-label { font-size: 11.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .02em; }
  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data-table th, table.data-table td { border-bottom: 1px solid var(--border); padding: 8px 8px; text-align: left; vertical-align: middle; }
  table.data-table th { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
  table.data-table tr.clickable { cursor: pointer; }
  table.data-table tr.clickable:hover { background: var(--surface-alt); }
  .badge { display: inline-block; padding: 2px 9px; font-size: 11.5px; font-weight: 600; border: 1px solid transparent; }
  .badge-brouillon { background: var(--info-bg); color: var(--accent); }
  .badge-cloture { background: var(--ok-bg); color: var(--ok); }
  .badge-annule { background: var(--danger-bg); color: var(--danger); }
  .badge-candidat { background: var(--info-bg); color: var(--accent); }
  .badge-attente { background: var(--warn-bg); color: var(--warn); }
  .badge-stagiaire { background: var(--info-bg); color: var(--accent); }
  .badge-forme { background: var(--ok-bg); color: var(--ok); }
  .badge-nonretenu { background: var(--danger-bg); color: var(--danger); }
  .flash { margin: 0 28px; padding: 10px 14px; border: 1px solid var(--border); background: var(--info-bg); font-size: 13px; }
  .flash.error { background: var(--danger-bg); border-color: var(--danger); }
  .flash.ok { background: var(--ok-bg); border-color: var(--ok); }
  .empty-state { color: var(--text-muted); font-style: italic; padding: 14px 0; }
  .tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; }
  .tab { padding: 10px 16px; font-size: 13px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; color: var(--text-muted); background: none; border-top: none; border-left: none; border-right: none; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .stage-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .stage-header h2 { margin: 0 0 4px; font-size: 20px; }
  .stage-ref { font-size: 12.5px; color: var(--text-muted); }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 50; }
  .modal { background: var(--surface); border: 1px solid var(--border); width: 100%; max-width: 640px; padding: 24px; }
  .modal h2 { margin: 0 0 14px; font-size: 17px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-daylabel { font-size: 11px; text-transform: uppercase; color: var(--text-muted); text-align: center; padding: 4px 0; }
  .cal-cell { min-height: 64px; border: 1px solid var(--border); padding: 4px; font-size: 11px; display: flex; flex-direction: column; gap: 2px; }
  .cal-cell.out { opacity: .35; }
  .cal-daynum { font-weight: 600; font-size: 11.5px; }
  .cal-chip { padding: 1px 5px; font-size: 10px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cal-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .cal-nav strong { min-width: 150px; text-align: center; }
  .link-row { display: flex; gap: 6px; align-items: center; }
  .link-row input { flex: 1; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; padding: 7px 9px; border: 1px solid var(--border); background: var(--surface-alt); color: var(--text); }
  .status-note { font-size: 11px; color: var(--text-muted); min-height: 14px; }
  .list-plain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .list-plain li { border: 1px solid var(--border); padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .muted { color: var(--text-muted); }
  .actions-bar { display: flex; gap: 10px; flex-wrap: wrap; }
  .flash button { flex-shrink: 0; }

  /* Lien à diffuser mis en avant + questions repliables (36e échange) — recrutement et satisfaction */
  .icon { width: 16px; height: 16px; flex-shrink: 0; display: block; }
  .badge-warn { background: var(--warn-bg); color: var(--warn); }
  .badge-icon { display: inline-flex; align-items: center; gap: 5px; }
  .link-callout { border: 1.5px solid var(--accent); background: var(--info-bg); padding: 16px 18px; }
  .link-callout-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .link-callout-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14.5px; }
  .link-callout-title .icon { color: var(--accent); }
  .link-callout .link-row { background: var(--surface); border: 1px solid var(--border); padding: 2px 2px 2px 12px; }
  .link-callout .link-row input { background: transparent; border: none; padding: 8px 0; }
  .disclosure { margin-top: 12px; border-top: 1px solid var(--border); }
  .disclosure-trigger { display: flex; align-items: center; gap: 6px; padding: 12px 0 0; font-size: 12.5px; font-weight: 600; color: var(--accent); cursor: pointer; background: none; border: none; width: 100%; text-align: left; }
  .disclosure-trigger .icon { transition: transform .15s; }
  .disclosure-trigger[aria-expanded="true"] .icon { transform: rotate(90deg); }
  .disclosure-body { padding: 14px 2px 2px; display: flex; flex-direction: column; gap: 12px; }
  .setup-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .setup-row .field { flex: 1; max-width: 220px; margin-bottom: 0; }
  .q-summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 14px 0; }
  .q-summary-counts { display: flex; gap: 8px; flex-wrap: wrap; }
  .count-pill { font-size: 11.5px; font-weight: 600; padding: 3px 9px; background: var(--surface-alt); border: 1px solid var(--border); color: var(--text-muted); }
  .accordion-cat { border: 1px solid var(--border); margin-bottom: 8px; }
  .accordion-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; cursor: pointer; background: var(--surface-alt); border: none; width: 100%; text-align: left; }
  .accordion-head-left { display: flex; align-items: center; gap: 10px; }
  .accordion-head-left .icon { color: var(--text-muted); transition: transform .15s; }
  .accordion-head[aria-expanded="true"] .accordion-head-left .icon { transform: rotate(90deg); }
  .accordion-cat-name { font-weight: 600; font-size: 13px; }
  .accordion-cat-meta { font-size: 11.5px; color: var(--text-muted); }
  .accordion-body { padding: 4px 14px 6px; }
  .q-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .q-row:last-child { border-bottom: none; }
  .q-row-main { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .q-label { font-size: 13px; }
  .q-type-tag { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .02em; }
  .q-toggles { display: flex; gap: 16px; flex-shrink: 0; padding-top: 2px; }
  .q-toggle { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-muted); white-space: nowrap; }
  .q-toggle input { margin: 0; }

  /* Palette de modules (bibliothèque) */
  .pg-palette-col { display: flex; flex-direction: column; min-height: 0; }
  .pg-palette { display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 200px; overflow-y: auto; }
  /* Modules obligatoires affichés en ligne sous la grille (plutôt qu'en colonne à côté) : pas de
     hauteur/scroll imposés, la rangée s'enroule (flex-wrap) sur plusieurs lignes si besoin. */
  .pg-palette.pg-palette-row { flex-direction: row; flex-wrap: wrap; min-height: 0; overflow-y: visible; }
  .pg-palette.pg-palette-row .pg-palette-item { flex: 0 0 auto; min-width: 160px; }
  .pg-palette-group { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin: 8px 0 2px; }
  .pg-palette-item { border: 1.5px solid var(--accent); background: var(--info-bg); padding: 7px 9px; font-size: 12px; cursor: grab; display: flex; flex-direction: column; gap: 2px; }
  .pg-palette-item:active { cursor: grabbing; }
  .pg-palette-item .pg-item-title { font-weight: 600; }
  .pg-palette-item .pg-item-meta { font-size: 10.5px; color: var(--text-muted); }
  .pg-palette-item.pg-complementaire { border-color: var(--text-muted); background: var(--surface-alt); }

  /* Table large avec défilement horizontal (ex. grille d'émargement) */
  .table-scroll { overflow-x: auto; }
  .table-scroll .data-table { min-width: 480px; }

  /* Sous-groupes pédagogiques : tableau de bord glisser-déposer */
  .sg-board { display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch; }
  /* Hauteur intrinsèque (auto), pas de valeur fixe : min-height ne sert que de plancher esthétique
     pour un groupe vide — la tuile s'étend vers le bas dès que le contenu (dropzones) en a besoin,
     au lieu de déborder de son cadre comme avec l'ancien partage de hauteur à parts égales. */
  .sg-group { border: 1px solid var(--border); background: var(--surface); padding: 10px 12px; flex: 1 1 230px; min-width: 210px; display: flex; flex-direction: column; min-height: 220px; }
  .sg-group.sg-pool { background: var(--surface-alt); border-style: dashed; }
  .sg-group-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .sg-group-head h4 { margin: 0; font-size: 13.5px; }
  .sg-sub { font-size: 10.5px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin: 8px 0 4px; }
  /* flex: 0 0 auto (plutôt que 1 1 0) : chaque zone prend exactement la hauteur que ses étiquettes
     réclament, sans se voir imposer un partage égal avec l'autre zone du même groupe — c'est ce
     partage forcé qui provoquait le débordement visuel des étiquettes quand une zone en contenait
     nettement plus que l'autre. */
  .sg-dropzone { flex: 0 0 auto; min-height: 90px; border: 1px dashed var(--border); padding: 6px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; }
  .sg-dropzone.drag-over { background: var(--info-bg); border-color: var(--accent); }
  .sg-chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--accent); background: var(--info-bg); padding: 3px 8px; font-size: 11.5px; cursor: grab; }
  .sg-chip:active { cursor: grabbing; }
  .sg-chip.sg-chip-stagiaire { border-color: var(--text-muted); background: var(--surface-alt); }
  .sg-chip .sgm-remove { border: none; background: transparent; color: inherit; font-weight: 700; cursor: pointer; padding: 0 0 0 2px; line-height: 1; font-size: 13px; }
  .sg-chip .sgm-remove:hover { color: var(--danger, #c8394b); }
  .sg-chip.sg-chip-stagiaire { position: relative; }
  .sg-chip.sg-chip-stagiaire:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* Bulle d'information stagiaire (académie / fonction), au survol ou au clic d'une étiquette
     dans les sous-groupes pédagogiques — un seul élément partagé, positionné dynamiquement en JS. */
  .sg-tooltip { position: fixed; z-index: 60; max-width: 240px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 4px 14px rgba(0,0,0,.18); padding: 8px 10px; font-size: 12px; line-height: 1.4; pointer-events: none; }
  .sg-tooltip[hidden] { display: none; }
  .sg-tooltip-name { font-weight: 700; margin-bottom: 3px; }
  .sg-tooltip-row { color: var(--text-muted); }
  .sg-tooltip-row strong { color: var(--text); font-weight: 600; }

  /* Grille visuelle jour / créneau */
  .pg-grid-scroll { overflow-x: auto; border: 1px solid var(--border); }
  .pg-wrap { display: flex; min-width: 560px; }
  .pg-gutter { flex: 0 0 56px; border-right: 1px solid var(--border); }
  .pg-gutter-head { height: 34px; border-bottom: 1px solid var(--border); background: var(--surface-alt); }
  .pg-gutter-row { height: 26px; font-size: 10px; color: var(--text-muted); padding: 1px 4px; border-bottom: 1px dashed var(--border); box-sizing: border-box; }
  .pg-day { flex: 1 0 150px; border-right: 1px solid var(--border); }
  .pg-day-head { height: 34px; box-sizing: border-box; font-size: 11px; font-weight: 700; text-align: center; padding: 8px 4px; border-bottom: 1px solid var(--border); background: var(--surface-alt); white-space: nowrap; }
  .pg-day-body { position: relative; cursor: pointer; }
  .pg-slot-row { height: 26px; box-sizing: border-box; border-bottom: 1px dashed var(--border); }
  .pg-slot-row:hover { background: var(--surface-alt); }
  .pg-slot-row.drag-over { background: var(--info-bg); }
  .pg-block { position: absolute; border: 1px solid var(--accent); background: var(--surface); padding: 2px 5px; font-size: 10.5px; overflow: hidden; cursor: grab; box-sizing: border-box; }
  .pg-block:active { cursor: grabbing; }
  .pg-block:hover { filter: brightness(0.97); }
  .pg-block .pg-block-title { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pg-block .pg-block-meta { display: block; font-size: 9.5px; color: var(--text-muted); }
  .pg-block.pg-unassigned { border-style: dashed; }
  .pg-block.pg-block-colored { background: var(--block-color); border-color: var(--block-color); color: #fff; }
  .pg-block.pg-block-colored .pg-block-meta { color: rgba(255,255,255,0.85); }
  .pg-block.pg-dragging { opacity: 0.4; }
  .pg-resize-handle { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; cursor: ns-resize; }
  .pg-block:hover .pg-resize-handle, .pg-block.pg-resizing .pg-resize-handle { background: rgba(0,0,0,0.18); }
  .pg-block.pg-block-colored:hover .pg-resize-handle, .pg-block.pg-block-colored.pg-resizing .pg-resize-handle { background: rgba(255,255,255,0.35); }
  .pg-block.pg-resizing { z-index: 5; }
  .pg-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .pg-legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); }
  .pg-legend-swatch { width: 10px; height: 10px; display: inline-block; border-radius: 2px; }
  .row-inline-radio { display: flex; gap: 14px; align-items: center; font-size: 12.5px; margin-bottom: 8px; }
  .row-inline-radio label { display: flex; align-items: center; gap: 5px; font-weight: 400; text-transform: none; letter-spacing: 0; }

  /* Pied de page (61e échange — FR-018 : mentions légales/accessibilité/données personnelles).
     Placé en dehors de #main (donc jamais effacé par render(), qui ne touche que main.innerHTML) —
     même principe que .topbar, hors de la zone régénérée à chaque changement d'onglet/écran.
     Seul « Données personnelles » est un vrai lien, peuplé dynamiquement par
     updateFooterLienDonnees() une fois pageIdDonneesPersonnelles connu (voir
     loadParametresWidgetIntoState) ; « Mentions légales »/« Accessibilité » n'ont pas de page dédiée
     à ce stade (hors périmètre de cet échange) et restent de simples libellés non cliquables. */
  .app-footer { border-top: 1px solid var(--border); margin-top: 12px; }
  .app-footer-inner { max-width: 1320px; margin: 0 auto; padding: 16px 28px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--text-muted); }
  .app-footer-link { color: var(--text-muted); text-decoration: underline; }
  .app-footer-link:hover { color: var(--accent); }
  .app-footer-link-disabled { text-decoration: none; cursor: default; opacity: .65; }
  .app-footer-link-disabled:hover { color: var(--text-muted); }
  .app-footer-sep { color: var(--border); }

  /* Encadré de rappel RGPD (61e échange), au-dessus de la saisie groupée de candidatures — voir
     renderStagiaires(). Ton "avertissement" (warn), cohérent avec .badge-warn déjà en place, mais
     sans reprendre .link-callout (ton accent/info, réservé aux liens à diffuser). */
  .rgpd-reminder { border: 1.5px solid var(--warn); background: var(--warn-bg); padding: 12px 16px; margin: 4px 0 14px; font-size: 12.5px; line-height: 1.5; }
  .rgpd-reminder strong { color: var(--warn); }
  .rgpd-reminder ul { margin: 6px 0 0; padding-left: 18px; }
  .rgpd-reminder li { margin-bottom: 2px; }

  @media print {
    .topbar, .tabs, .actions-bar, .flash, .skip-link, .app-footer { display: none !important; }
  }
</style>

<div class="app">
  <a href="#main" class="skip-link">Aller au contenu</a>
  <header class="topbar">
    <div>
      <p class="app-name">Gestion de stage FPGC</p>
      <p class="app-sub" id="topbarSub">Chargement des données…</p>
    </div>
    <div class="topbar-actions">
      <button type="button" class="btn btn-secondary" id="btnSettings" title="Mon académie">⚙ Mon académie</button>
      <button type="button" class="btn btn-secondary" id="btnTableMap" title="Faire correspondre les tables Grist utilisées par le widget">⚙ Tables</button>
      <button type="button" class="btn btn-secondary" id="btnHome">Accueil</button>
    </div>
  </header>
  <div id="flash" class="flash" hidden role="status"></div>
