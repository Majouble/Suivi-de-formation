<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-alt: #f3f3fb;
    --text: #1e1e28;
    --text-muted: #5d5d6b;
    --border: #dbdbe4;
    --accent: #000091;
    --accent-contrast: #ffffff;
    --ok: #18753c;
    --ok-bg: #e8f5ea;
    --warn: #8d5a00;
    --warn-bg: #fef2e1;
    --danger: #b71c1c;
    --danger-bg: #fde8e8;
    --info-bg: #e5e5f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171f; --surface: #1d1d27; --surface-alt: #24242f;
      --text: #f1f1f4; --text-muted: #a3a3b2; --border: #34343f;
      --accent: #8b8bff; --accent-contrast: #0d0d14;
      --ok: #4fd07a; --ok-bg: #123321; --warn: #f0b429; --warn-bg: #3a2a05;
      --danger: #ff6b6b; --danger-bg: #3a1414; --info-bg: #24243a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Work Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
  a { color: var(--accent); }
  button { font-family: inherit; font-size: inherit; color: inherit; }
  .skip-link { position: absolute; left: -999px; top: 0; background: var(--accent); color: var(--accent-contrast); padding: 8px 14px; z-index: 100; }
  .skip-link:focus { left: 8px; top: 8px; }
  .app { min-height: 100vh; width: 100%; }
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 28px; border-bottom: 2px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 20; }
  .app-name { font-size: 18px; font-weight: 700; margin: 0; }
  .app-sub { font-size: 12.5px; color: var(--text-muted); margin: 2px 0 0; }
  .content { padding: 24px 28px 80px; max-width: 1100px; margin: 0 auto; }
  .content:focus { outline: none; }
  .lede { font-size: 14.5px; max-width: 760px; margin: 0 0 22px; }
  .card { background: var(--surface); border: 1px solid var(--border); padding: 20px 22px; margin-bottom: 20px; }
  .section-title { font-size: 17px; font-weight: 700; margin: 0 0 4px; }
  .section-sub { font-size: 13px; color: var(--text-muted); margin: 0 0 14px; }
  .field-help { font-size: 11.5px; color: var(--text-muted); }
  .warning-banner { border: 1.5px solid var(--warn); background: var(--warn-bg); color: var(--warn); padding: 12px 16px; margin: 0 0 20px; font-size: 13px; }
  .toc { font-size: 13px; background: var(--surface-alt); border: 1px solid var(--border); padding: 16px 20px; margin: 0 0 26px; }
  .toc h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: var(--text-muted); margin: 0 0 10px; }
  .toc-cat { margin: 0 0 10px; }
  .toc-cat:last-child { margin-bottom: 0; }
  .toc-cat-label { font-weight: 700; display: block; margin-bottom: 4px; }
  .toc ol { list-style: none; margin: 0; padding: 0; }
  .toc li { margin-bottom: 3px; }
  .toc a { text-decoration: none; }
  .toc a:hover { text-decoration: underline; }
  .toc .toc-disabled { color: var(--text-muted); }
  .cat-section { margin-bottom: 30px; scroll-margin-top: 74px; }
  .cat-section h2 { font-size: 16px; margin: 0 0 4px; }
  .cat-note { font-size: 12.5px; color: var(--text-muted); margin: 0 0 14px; }
  .view-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .view-card { display: flex; flex-direction: column; gap: 10px; }
  .view-card h3 { margin: 0; font-size: 14.5px; }
  .view-card p { margin: 0; font-size: 12.5px; color: var(--text-muted); flex-grow: 1; }
  .view-card-staff-note { font-size: 11.5px; background: var(--info-bg); color: var(--text); padding: 7px 9px; border-left: 3px solid var(--accent); }
  .btn { border: 1.5px solid transparent; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; background: var(--surface-alt); border-color: var(--border); color: var(--text); text-decoration: none; align-self: flex-start; }
  .btn:hover { filter: brightness(0.97); }
  .btn:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .view-card-disabled-link { font-size: 12px; color: var(--text-muted); border: 1px dashed var(--border); padding: 7px 12px; align-self: flex-start; cursor: default; }
  .app-footer { border-top: 1px solid var(--border); margin-top: 12px; }
  .app-footer-inner { max-width: 1100px; margin: 0 auto; padding: 16px 28px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--text-muted); }
  .app-footer-link { color: var(--text-muted); text-decoration: underline; }
  .app-footer-link:hover { color: var(--accent); }
  .app-footer-link-disabled { text-decoration: none; cursor: default; opacity: .65; }
  @media print {
    .topbar, .toc, .skip-link, .app-footer { display: none !important; }
  }
</style>

<div class="app">
  <a href="#main" class="skip-link">Aller au contenu</a>
  <header class="topbar">
    <div>
      <p class="app-name">Suivi FPGC — Espace de travail Grist</p>
      <p class="app-sub" id="topbarSub">Chargement…</p>
    </div>
  </header>
  <main id="main" class="content" tabindex="-1"></main>
  <footer class="app-footer">
    <div class="app-footer-inner">
      <span class="app-footer-link app-footer-link-disabled" title="Page non encore disponible">Mentions légales</span>
      <span aria-hidden="true">·</span>
      <span class="app-footer-link app-footer-link-disabled" title="Page non encore disponible">Accessibilité</span>
      <span aria-hidden="true">·</span>
      <a href="#" id="footerLienDonnees" class="app-footer-link app-footer-link-disabled" aria-disabled="true">Données personnelles</a>
    </div>
  </footer>
</div>

<script src="../commun/version.js"></script>
<script src="accueil-espace.js"></script>
