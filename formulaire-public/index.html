<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-alt: #f3f3fb;
    --text: #1e1e28;
    --text-muted: #5d5d6b;
    --border: #dbdbe4;
    --accent: #000091;
    --accent-contrast: #ffffff;
    --ok: #18753c;
    --ok-bg: #e8f5ea;
    --warn: #8d5a00;
    --warn-bg: #fef2e1;
    --danger: #b71c1c;
    --danger-bg: #fde8e8;
    --info-bg: #e5e5f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171f; --surface: #1d1d27; --surface-alt: #24242f;
      --text: #f1f1f4; --text-muted: #a3a3b2; --border: #34343f;
      --accent: #8b8bff; --accent-contrast: #0d0d14;
      --ok: #4fd07a; --ok-bg: #123321; --warn: #f0b429; --warn-bg: #3a2a05;
      --danger: #ff6b6b; --danger-bg: #3a1414; --info-bg: #24243a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Work Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.45; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  a { color: var(--accent); }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  .content { padding: 28px 16px 80px; max-width: 620px; margin: 0 auto; }
  .section-sub { font-size: 13px; color: var(--text-muted); margin: 0 0 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); padding: 22px 24px; margin-bottom: 20px; }
  .card h2 { margin: 0 0 12px; font-size: 18px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
  .field label { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--text-muted); font-weight: 600; }
  .field input, .field select, .field textarea { padding: 9px 10px; border: 1px solid var(--border); background: var(--surface-alt); color: var(--text); }
  .field-help { font-size: 11.5px; color: var(--text-muted); margin: 2px 0 0; }
  .row-inline { display: flex; align-items: center; gap: 8px; }
  .btn { border: 1.5px solid transparent; padding: 9px 18px; font-size: 13.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; background: var(--surface-alt); border-color: var(--border); color: var(--text); }
  .btn:hover { filter: brightness(0.97); }
  .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .actions-bar { display: flex; gap: 10px; flex-wrap: wrap; }
  .status-note { font-size: 12px; color: var(--danger); min-height: 14px; margin: 8px 0 0; }
  .btn-small { padding: 5px 10px; font-size: 12px; }
  .link-row { display: flex; gap: 6px; align-items: center; }
  .link-row input { flex: 1; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; padding: 7px 9px; border: 1px solid var(--border); background: var(--surface-alt); color: var(--text); }
  .table-scroll { overflow-x: auto; }
  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 420px; }
  table.data-table th, table.data-table td { border-bottom: 1px solid var(--border); padding: 8px 8px; text-align: left; vertical-align: middle; }
  table.data-table th { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }

  /* Autocomplétion établissement (42e échange) — voir formulaire-public.js, bindEtablissementAutocomplete */
  .etab-autocomplete { position: relative; }
  .etab-suggestions { position: absolute; z-index: 20; top: calc(100% + 2px); left: 0; right: 0; max-height: 260px; overflow-y: auto; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .etab-suggestion { padding: 8px 10px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 13px; }
  .etab-suggestion:last-child { border-bottom: none; }
  .etab-suggestion:hover, .etab-suggestion:focus { background: var(--surface-alt); outline: none; }
  .etab-suggestion-commune, .etab-suggestion-etat { color: var(--text-muted); font-size: 12px; }
  .etab-status { min-height: 14px; }

  /* Champ UAI en lecture seule (45e échange) — rempli uniquement par la sélection d'une suggestion,
     jamais saisissable à la main : traitement visuel volontairement atténué/désactivé pour signaler
     que ce champ ne s'édite pas directement, cohérent avec .field label/.field-help ci-dessus. */
  .etab-uai-label { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--text-muted); font-weight: 600; margin-top: 10px; display: block; }
  .etab-uai-input { margin-top: 4px; width: 100%; padding: 9px 10px; border: 1px dashed var(--border); background: var(--surface-alt); color: var(--text-muted); font-family: 'IBM Plex Mono', ui-monospace, monospace; cursor: default; }
  .etab-uai-input:focus { outline: none; }

  /* Fenêtre de confirmation avant la bascule vers l'espace stagiaire (40e échange, tour suivant x3)
     — voir formulaire-public.js, renderEnvoye()/bindEnvoye(). */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal-card { max-width: 480px; width: 100%; margin: 0; box-shadow: 0 8px 28px rgba(0,0,0,.28); }

  /* Pied de page (61e échange — FR-018 : mentions légales/accessibilité/données personnelles).
     Placé dans .content mais hors de #main, donc jamais effacé par render() (qui ne touche que
     main.innerHTML) — voir la même note dans gestion-stage-fpgc.html. Hérite du max-width/padding
     de .content ci-dessus, pas de règle dédiée nécessaire ici. Seul « Données personnelles » est un
     vrai lien, peuplé par updateFooterLienDonnees() une fois pageIdDonneesPersonnelles connu. */
  .app-footer { border-top: 1px solid var(--border); margin-top: 24px; padding-top: 16px; }
  .app-footer-inner { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--text-muted); }
  .app-footer-link { color: var(--text-muted); text-decoration: underline; }
  .app-footer-link:hover { color: var(--accent); }
  .app-footer-link-disabled { text-decoration: none; cursor: default; opacity: .65; }
  .app-footer-link-disabled:hover { color: var(--text-muted); }
  .app-footer-sep { color: var(--border); }
</style>

<div class="content">
  <main id="main"></main>
  <footer class="app-footer">
    <div class="app-footer-inner">
      <span class="app-footer-link app-footer-link-disabled" title="Page non encore disponible">Mentions légales</span>
      <span class="app-footer-sep" aria-hidden="true">·</span>
      <span class="app-footer-link app-footer-link-disabled" title="Page non encore disponible">Accessibilité</span>
      <span class="app-footer-sep" aria-hidden="true">·</span>
      <a href="#" id="footerLienDonnees" class="app-footer-link app-footer-link-disabled" aria-disabled="true">Données personnelles</a>
    </div>
  </footer>
</div>
<script src="../commun/version.js"></script>
<script src="../commun/normalisation.js"></script>
<script src="formulaire-public.js"></script>
