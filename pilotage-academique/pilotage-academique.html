<!-- FPGC-08 (72e échange) : la protection contre la compromission de CDN est assurée par les
     attributs integrity (SRI) + crossorigin="anonymous" sur chaque ressource externe ci-dessous.
     Une balise <meta> CSP est INCOMPATIBLE avec les widgets Grist : grist-plugin-api.js utilise
     eval() en interne, Grist injecte des scripts inline dans l'iframe, et connect-src empêche le
     chargement des source maps. Une CSP efficace pour ce widget doit être posée au niveau des
     en-têtes HTTP du serveur hébergeant les widgets (nginx, caddy, etc.) — pas dans le HTML.
     Exemple d'en-tête HTTP à ajouter côté serveur :
       Content-Security-Policy: script-src 'self' 'unsafe-eval' 'unsafe-inline'
         https://docs.getgrist.com https://cdn.jsdelivr.net;
         img-src data: blob: https://cdn.jsdelivr.net https://data.geopf.fr;
         object-src 'none'; -->
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
