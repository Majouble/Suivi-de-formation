<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --bg: #ffffff; --surface: #ffffff; --surface-alt: #f3f3fb;
    --text: #1e1e28; --text-muted: #5d5d6b; --border: #dbdbe4;
    --accent: #000091; --accent-contrast: #ffffff;
    --ok: #18753c; --ok-bg: #e8f5ea;
    --warn: #8d5a00; --warn-bg: #fef2e1;
    --danger: #b71c1c; --danger-bg: #fde8e8;
    --info-bg: #e5e5f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171f; --surface: #1d1d27; --surface-alt: #24242f;
      --text: #f1f1f4; --text-muted: #a3a3b2; --border: #34343f;
      --accent: #8b8bff; --accent-contrast: #0d0d14;
      --ok: #4fd07a; --ok-bg: #123321; --warn: #f0b429; --warn-bg: #3a2a05;
      --danger: #ff6b6b; --danger-bg: #3a1414; --info-bg: #24243a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Work Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.45; }
  .mono, code { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; }
  button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 28px; border-bottom: 2px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 20; flex-wrap: wrap; }
  .app-name { font-size: 18px; font-weight: 700; margin: 0; }
  .app-sub { font-size: 12.5px; color: var(--text-muted); margin: 2px 0 0; }
  .topbar-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { border: 1.5px solid var(--border); padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; background: var(--surface-alt); color: var(--text); }
  .btn:hover { filter: brightness(0.97); }
  .btn:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .btn-secondary { background: transparent; border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .content { padding: 24px 28px 80px; max-width: 1200px; margin: 0 auto; }
  .card { background: var(--surface); border: 1px solid var(--border); padding: 18px 22px; margin-bottom: 18px; }
  .card h2 { margin: 0 0 4px; font-size: 16px; }
  .card-sub { font-size: 13px; color: var(--text-muted); margin: 0 0 14px; }
  .flash { margin: 12px 28px 0; padding: 10px 14px; border: 1px solid var(--border); background: var(--info-bg); font-size: 13px; white-space: pre-wrap; }
  .flash.error { background: var(--danger-bg); border-color: var(--danger); }
  .flash.ok { background: var(--ok-bg); border-color: var(--ok); }
  .checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .checks li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--border); }
  .checks li.ko { border-color: var(--danger); background: var(--danger-bg); }
  .checks li.warn { border-color: var(--warn); background: var(--warn-bg); }
  .check-icon { font-weight: 700; width: 18px; flex-shrink: 0; text-align: center; }
  .ok-c { color: var(--ok); } .ko-c { color: var(--danger); } .warn-c { color: var(--warn); }
  .check-detail { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .badge { display: inline-block; padding: 2px 9px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .badge-ok { background: var(--ok-bg); color: var(--ok); }
  .badge-warn { background: var(--warn-bg); color: var(--warn); }
  .badge-ko { background: var(--danger-bg); color: var(--danger); }
  .badge-info { background: var(--info-bg); color: var(--accent); }
  details.table-card { border: 1px solid var(--border); margin-bottom: 8px; }
  details.table-card > summary { list-style: none; cursor: pointer; padding: 11px 14px; background: var(--surface-alt); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  details.table-card > summary::-webkit-details-marker { display: none; }
  .table-name { font-weight: 600; }
  .table-desc { font-size: 12px; color: var(--text-muted); }
  .table-body { padding: 10px 14px 14px; }
  .rules-title { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--text-muted); font-weight: 700; margin: 10px 0 6px; }
  table.rules { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.rules th, table.rules td { border-bottom: 1px solid var(--border); padding: 6px 6px; text-align: left; vertical-align: top; }
  table.rules th { font-size: 10.5px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
  .perm { display: inline-block; min-width: 22px; text-align: center; font-weight: 700; font-size: 11px; padding: 1px 4px; margin-right: 2px; }
  .perm-allow { background: var(--ok-bg); color: var(--ok); }
  .perm-deny { background: var(--danger-bg); color: var(--danger); }
  .perm-none { color: var(--text-muted); }
  .rule-label { font-weight: 600; }
  .rule-formula { display: block; color: var(--text-muted); word-break: break-word; margin-top: 2px; }
  .scroll { overflow-x: auto; }
  .row-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .muted { color: var(--text-muted); }
  .note { font-size: 12.5px; padding: 10px 12px; background: var(--info-bg); margin: 10px 0 0; }
  .note-warn { background: var(--warn-bg); border: 1px solid var(--warn); }
  .annexe-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .annexe-row select { padding: 6px 8px; border: 1px solid var(--border); background: var(--surface-alt); }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 50; }
  .modal { background: var(--surface); border: 1px solid var(--border); width: 100%; max-width: 620px; padding: 22px 24px; }
  .modal h2 { margin: 0 0 12px; font-size: 17px; }
  .modal ul { margin: 6px 0 0; padding-left: 18px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .summary-counts { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 12px; }
</style>

<header class="topbar">
  <div>
    <p class="app-name">Gestion des accès</p>
    <p class="app-sub" id="topbarSub">Chargement…</p>
  </div>
  <div class="topbar-actions">
    <button type="button" class="btn" id="btnRefresh">Revérifier</button>
  </div>
</header>
<div id="flash" class="flash" hidden role="status"></div>
<main id="main" class="content" tabindex="-1"></main>
<script src="../commun/version.js"></script>
<script src="gestion-acces.js"></script>
